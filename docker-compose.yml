services:
  postgres:
    image: postgres:16-alpine
    container_name: socialhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialhub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-socialhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-9910}:5432"
    volumes:
      - socialhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialhub} -d ${POSTGRES_DB:-socialhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialhub_net

  redis:
    image: redis:7-alpine
    container_name: socialhub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-9911}:6379"
    volumes:
      - socialhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialhub_net

volumes:
  socialhub_postgres_data:
    name: socialhub_postgres_data
  socialhub_redis_data:
    name: socialhub_redis_data

networks:
  socialhub_net:
    name: socialhub_network
    driver: bridge
